name: Build Blog

on:
  schedule:
    # 記事の公開予約を時刻どおりに近づけるため15分ごとに見に行く。
    # 中身が変わったときしかコミットしないので、記録は増えない
    - cron: '*/15 * * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 道具の写真を縮小するのに使う。入っていない実行環境のときだけ入れる
      - name: Ensure ImageMagick
        run: command -v convert >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)

      - name: Fetch Notion data and build HTML
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: 840343e3f2cd498389bcc369bd5a791b
          TOOLS_DATABASE_ID: 0d88f72d7a944b94963e5b07a75d4739
        run: node build.js

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # 道具の登録が0件のときは tools.html と images が作られないので、あるときだけ追加する
          stage() {
            git add index.html
            if [ -f tools.html ]; then git add tools.html; fi
            if [ -d images ]; then git add images; fi
          }

          stage
          if git diff --staged --quiet; then echo "変更はありません"; exit 0; fi
          git commit -m "Update blog"
          if git push; then exit 0; fi

          # ビルドが同時に走ると、後から終わった方が押せずに失敗する。
          # 生成物はNotionから作り直したものなので、取り込んだうえで押し直す
          echo "別のビルドが先に反映していたため、取り込んでから押し直します"
          git fetch origin main
          git reset --soft origin/main
          stage
          if git diff --staged --quiet; then echo "変更はありません"; exit 0; fi
          git commit -m "Update blog"
          git push

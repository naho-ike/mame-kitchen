name: Build Blog

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Notion data and build HTML
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: 840343e3f2cd498389bcc369bd5a791b
          TOOLS_DATABASE_ID: 0d88f72d7a944b94963e5b07a75d4739
        run: node build.js

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html
          # 道具の登録が0件のときは tools.html と images が作られないので、あるときだけ追加する
          if [ -f tools.html ]; then git add tools.html; fi
          if [ -d images ]; then git add images; fi
          git diff --staged --quiet || git commit -m "Update blog"
          git push
